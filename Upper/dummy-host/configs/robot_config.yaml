robot_id: dummy_v2_001
config_version: 8
# Operator-confirmed arm/gripper calibration baseline. Changing a robot-safety
# value changes the robot hash and requires regenerating/reflashing firmware.
# Camera fields have their own rig hash and may be overridden by --camera-rig.
robot_calibration_id: dummy_v2_001-arm-gripper-20260821-v2
hardware_parameters_verified: true
external_target_execution_ready: false

joint_order: [joint1, joint2, joint3, joint4, joint5, joint6, gripper]
joint_unit: rad
action_semantics: absolute_joint_position
control_rate_hz: 20
firmware_loop_hz: 200
# v2.1 deadline-driven CAN scheduler. Rates are outbound transactions per node;
# position/temperature replies add roughly 287 frames/s on top of the 637
# scheduled frames/s. There is no runtime fallback to a lower feedback rate.
can_scheduler_watchdog_hz: 1000
can_target_hz_per_node: 50
can_position_hz_per_node: 40
can_temperature_hz_per_node: 1
coherent_max_skew_ms: 30
# v2.2.1 offline-safe defaults. The first two values must be replaced by
# bench-measured P99.9 margins before external execution is re-enabled.
can_node_quiet_us: 5000
can_response_timeout_us: 4000
can_tx_abort_timeout_us: 5000
can_target_fanout_timeout_us: 15000

# 以下值已经过逐关节真机复核，并由上面的 calibration ID 冻结。
# 2026-08-21 操作者真机复测确认 J1～J6 的正确减速比均为 50。
# 二进制协议和上位机统一使用 URDF 关节坐标。固件旧坐标仅保留在 MCU 内部：
# q_urdf = joint_sign * (q_firmware - joint_zero_offset_rad)。
# 下列方向由 URDF、固件 FK 和逐轴低速真机测试共同确认。
joint_zero_offset_rad: [0.0, -1.274090, 3.141593, 0.0, 0.0, 0.0]
joint_sign: [1, 1, 1, -1, 1, -1]
joint_reduction: [50.0, 50.0, 50.0, 50.0, 50.0, 50.0]
# 操作者确认的绝对安全限位，已从旧固件角度换算为 URDF 弧度：
# firmware_deg = [-170..170, -70..100, 30..180, -180..180, -90..90, -360..200]。
joint_limit_min_rad: [-2.967059728, 0.052359878, -2.617993878, -3.141592654, -1.570796327, -3.490658504]
joint_limit_max_rad: [2.967059728, 3.019419606, 0.0, 3.141592654, 1.570796327, 6.283185307]
joint_velocity_limit_rad_s: [0.35, 0.35, 0.35, 0.50, 0.50, 0.70]
joint_acceleration_limit_rad_s2: [0.70, 0.70, 0.70, 1.00, 1.00, 1.40]
# 旧 REST_POSE 的 J2=-73° 已超出新的 -70° 安全下限；夹到边界后对应 URDF +3°。
initial_pose_rad: [0.0, 0.052359878, 0.0, 0.0, 0.0, 0.0]

gripper_range: [0.0, 1.0]
gripper_state_feedback: true
# 夹爪使用归一化行程单位；固件 200 Hz 执行器独立限速/限加速度。
gripper_velocity_limit_per_s: 0.20
gripper_acceleration_limit_per_s2: 0.80

# 步骤 8 反馈安全监督器。前六项单位为 rad，夹爪阈值为归一化行程。
# 一般跟随超差或短时反馈陈旧进入 HOLD；反馈持续丢失和过温进入锁存 FAULT。
joint_following_error_limit_rad: [0.12, 0.12, 0.12, 0.15, 0.15, 0.18]
gripper_following_error_limit: 0.15
following_error_hold_ms: 250
feedback_hold_ms: 100
feedback_fault_ms: 500
temperature_max_age_ms: 2500
temperature_fault_c: 75.0
temperature_fault_ms: 1000

max_state_age_ms: 200
target_ttl_ms: 200
lease_timeout_ms: 500
max_target_overshoot_rad: 0.10

camera_rig_id: lab_wrist_d435_v1
camera_rig_version: 1
cameras:
  wrist:
    driver: realsense
    model: D435
    enabled: true
    required: true
    device_serial: ""
    width: 640
    height: 480
    fps: 30
    # The SDK is configured for BGR; the camera adapter normalizes it to RGB.
    color_format: rgb8
    depth_format: z16
    align_depth_to_color: true
    max_frame_age_ms: 100
    max_sync_skew_ms: 50
    calibration_version: uncalibrated-v0
    # 固定曝光前先在目标照明下实测；null 表示暂由设备自动控制。
    color_exposure: null
    color_white_balance: null
    depth_exposure: null
