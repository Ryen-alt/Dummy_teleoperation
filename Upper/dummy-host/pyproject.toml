[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dummy-host"
version = "0.1.0"
description = "Safety-oriented Linux host for the Dummy robot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
d435 = ["pyrealsense2>=2.55"]
dev = ["pytest>=8.0"]

[project.scripts]
dummy-host-diagnose = "dummy_host.apps.diagnose:main"
dummy-host-camera = "dummy_host.apps.camera_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

